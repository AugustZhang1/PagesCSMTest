media:
  folder: assets/images
content:
  - name: homepage
    label: Homepage Content
    type: file
    file: content.json
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - name: title
            type: string
          - name: subtitle
            type: string
      - name: aboutText
        label: About Text
        type: text
      - name: features
        label: Feature Cards
        type: list
        fields:
          - name: title
            type: string
          - name: description
            type: text
      - name: contactEmail
        label: Contact Email
        type: string
      - name: footerText
        label: Footer Copyright
        type: string
  - name: blog
    label: Blog Posts
    type: file
    file: blog.json
    fields:
      - name: posts
        label: Blog Posts
        type: list
        fields:
          - name: title
            label: Title
            type: string
          - name: date
            label: Date
            type: date
          - name: image
            label: Featured Image
            type: image
          - name: body
            label: Body
            type: text